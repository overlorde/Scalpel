[build-system]
# Runtime dependencies do not belong here; only what is needed to build the
# package itself.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scalpel"
version = "1.0b1"
description = "Scalpel: The Python Static Analysis Framework"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "graphviz>=0.17",
    "networkx>=2.6",
    "typeshed-client>=2.2.0",
    "regex",
    "packaging",
    # 0.0.7 and 0.0.8 ship an import package whose casing does not match
    # their own internal imports, which breaks on case-sensitive filesystems
    "pycg==0.0.6",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "myst_parser",
    "sphinx_rtd_theme",
    "sphinxcontrib-spelling",
    "pydoctor",
]

[project.urls]
"Homepage" = "https://github.com/SMAT-Lab/Scalpel"
"Bug Tracker" = "https://github.com/SMAT-Lab/Scalpel/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scalpel*"]

[tool.black]
line-length = 88
target_version = ['py39', 'py310', 'py311', 'py312']
preview = true
exclude = '''
/(
    \.eggs         # exclude a few common directories in the
  | \.git          # root of the project
  | \.mypy_cache
  | \.vscode
  | build
  | dist
  | doc/tutorial
  | doc/_build
  | doc/auto_examples
  | sklearn/externals
  | asv_benchmarks/env
)/
'''

[tool.ruff]
# Never enforce `E501` (line length violations).
ignore = ["E501"]

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402"]
"path/to/file.py" = ["E402"]

[tool.isort]
profile = "black"
